[package]
name = "lumi-agents-control-plane-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "matched-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-service = "0.3.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["http", "axum", "d1", "queue"] }
worker-macros = { version = "0.8", features = ["http"] }
