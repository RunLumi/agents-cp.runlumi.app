[package]
name = "lumi-agents-control-plane-api"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "matched-path", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower-service = "0.3.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["http", "axum", "d1", "queue"] }
worker-macros = { version = "0.8", features = ["http"] }
passkey-auth = "0.1.3"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
base64 = "0.22"
url = "2"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
